## 数据总线 · Logstash 事件总线 pipeline
## 说明：basic license 下 Fleet 无法让 agent 走 logstash output（per-policy output 需 platinum，
##       且 fleet-server-policy 强制 ES output），因此 Logstash 直接读 zeek 日志卷，
##       承担"富化 + Redis Stream 事件总线"职责；ES 主存储由 Elastic Agent（Zeek Integration）
##       负责归一化写入。两线并行，均消费同一 zeek-logs 卷。
## 设计文档："另一份以事件信封发布至 Redis Streams" —— 事件信封：event_id / 五元组 / ts / 富化标签

input {
  file {
    path => [
      "/var/log/zeek/conn.log",
      "/var/log/zeek/http.log",
      "/var/log/zeek/dns.log",
      "/var/log/zeek/ssl.log",
      "/var/log/zeek/notice.log"
    ]
    start_position => "beginning"
    sincedb_path => "/usr/share/logstash/data/sincedb_zeek"
    codec => json
  }
}

filter {
  ## 解析 zeek JSON → 事件信封 → Redis Stream XADD
  ruby {
    code => '
      require "redis"
      require "securerandom"

      @redis ||= Redis.new(
        host: "redis",
        port: 6379,
        password: ENV["REDIS_PASSWORD"],
        timeout: 2,
        reconnect_attempts: 1
      )

      begin
        path = event.get("[log][file][path]").to_s
        dataset = case path
          when /conn/   then "zeek.connection"
          when /http/   then "zeek.http"
          when /dns/    then "zeek.dns"
          when /ssl/    then "zeek.ssl"
          when /notice/ then "zeek.notice"
          else "zeek.other"
        end
        event.set("[event][dataset]", dataset)

        event_id = SecureRandom.uuid
        event.set("[@metadata][event_id]", event_id)

        @redis.xadd("analysis:events", {
          "event_id" => event_id,
          "ts"       => event.get("@timestamp").to_s,
          "src_ip"   => event.get("id.orig_h").to_s,
          "src_port" => event.get("id.orig_p").to_s,
          "dst_ip"   => event.get("id.resp_h").to_s,
          "dst_port" => event.get("id.resp_p").to_s,
          "proto"    => event.get("proto").to_s,
          "dataset"  => dataset,
          "enriched" => "true"
        })
      rescue => e
        # Redis 双写失败不阻断
      end
    '
  }

  ## 富化标签占位（后续接入 IOC 匹配检测）
  mutate {
    add_field => { "labels" => "databus" }
  }
}

## 事件总线由 ruby filter 写入 Redis Stream（analysis:events）
## ES 主存储由 Elastic Agent（Zeek Integration）负责，避免重复写入
output {
  # 可选：控制台调试
  # stdout { codec => rubydebug }
}
