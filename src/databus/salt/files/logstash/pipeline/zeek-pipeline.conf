## 数据总线 · Logstash 事件总线 pipeline
## 说明：basic license 下 Fleet 无法让 agent 走 logstash output（per-policy output 需 platinum，
##       且 fleet-server-policy 强制 ES output），因此 Logstash 直接读 zeek 日志卷，
##       承担"富化 + Redis Stream 事件总线"职责；ES 主存储由 Elastic Agent（Zeek Integration）
##       负责归一化写入。两线并行，均消费同一 zeek-logs 卷。
## 设计文档："另一份以事件信封发布至 Redis Streams" —— 事件信封：event_id / 五元组 / ts / 富化标签
##
## 同步策略：本 pipeline 与 src/databus/salt/scripts/fleet-setup.sh 的
##   Zeek Integration package policy 一一对应，覆盖全部 43 个 dataset。
##   增减 dataset 时务必同步两边；input.path / DATASET_MAP 都要改。
##
## 2026-09-08 适配智能体侧要求（v1）：
##   - event_id 改为基于 zeek.uid 派生（全局唯一 + 重推稳定）
##   - 移除 zeek.dhcp 排除（全量 43 dataset 推送）
##   - zeek{} 嵌套字段改为全量透传（保留 Zeek 原始字段）
##   - XADD 失败加重试 + 死信队列（避免静默丢事件）

input {
  file {
    path => [
      "/var/log/zeek/capture_loss.log",
      "/var/log/zeek/conn.log",
      "/var/log/zeek/dce_rpc.log",
      "/var/log/zeek/dhcp.log",
      "/var/log/zeek/dnp3.log",
      "/var/log/zeek/dns.log",
      "/var/log/zeek/dpd.log",
      "/var/log/zeek/files.log",
      "/var/log/zeek/ftp.log",
      "/var/log/zeek/http.log",
      "/var/log/zeek/intel.log",
      "/var/log/zeek/irc.log",
      "/var/log/zeek/kerberos.log",
      "/var/log/zeek/known_certs.log",
      "/var/log/zeek/known_hosts.log",
      "/var/log/zeek/known_services.log",
      "/var/log/zeek/modbus.log",
      "/var/log/zeek/mysql.log",
      "/var/log/zeek/notice.log",
      "/var/log/zeek/ntlm.log",
      "/var/log/zeek/ntp.log",
      "/var/log/zeek/ocsp.log",
      "/var/log/zeek/pe.log",
      "/var/log/zeek/radius.log",
      "/var/log/zeek/rdp.log",
      "/var/log/zeek/rfb.log",
      "/var/log/zeek/signature.log",
      "/var/log/zeek/sip.log",
      "/var/log/zeek/smb_cmd.log",
      "/var/log/zeek/smb_files.log",
      "/var/log/zeek/smb_mapping.log",
      "/var/log/zeek/smtp.log",
      "/var/log/zeek/snmp.log",
      "/var/log/zeek/socks.log",
      "/var/log/zeek/software.log",
      "/var/log/zeek/ssh.log",
      "/var/log/zeek/ssl.log",
      "/var/log/zeek/stats.log",
      "/var/log/zeek/syslog.log",
      "/var/log/zeek/traceroute.log",
      "/var/log/zeek/tunnel.log",
      "/var/log/zeek/weird.log",
      "/var/log/zeek/x509.log",
      # zeek 8.x 新增（43 dataset 之外的补充，确保全协议进 Stream）
      "/var/log/zeek/analyzer.log",
      "/var/log/zeek/postgresql.log",
      "/var/log/zeek/quic.log",
      "/var/log/zeek/websocket.log"
    ]
    start_position => "beginning"
    sincedb_path => "/usr/share/logstash/data/sincedb_zeek"
    codec => json
  }
}

filter {
  ## 解析 zeek JSON → 事件信封 → Redis Stream XADD
  ruby {
    code => '
      require "json"
      require "redis"
      require "fileutils"
      require "time"  # Time#iso8601

      # 死信队列：XADD 3 次重试仍失败时落盘路径（卷 nss-ndr-logstash-data 持久化）
      DLQ_DIR = "/usr/share/logstash/data/dlq"
      DLQ_FILE = File.join(DLQ_DIR, "analysis_events_dead.jsonl")

      @redis ||= Redis.new(
        host: "redis",
        port: 6379,
        password: ENV["REDIS_PASSWORD"],
        timeout: 2,
        reconnect_attempts: 1
      )

      # 路径（basename）→ zeek.* dataset 名；与 fleet-setup.sh 一一对应。
      # 注意：路径比较只用 basename（event.get("[log][file][path]") 是绝对路径）。
      DATASET_MAP = {
        "analyzer"        => "zeek.analyzer",
        "capture_loss"    => "zeek.capture_loss",
        "conn"            => "zeek.connection",
        "dce_rpc"         => "zeek.dce_rpc",
        "dhcp"            => "zeek.dhcp",
        "dnp3"            => "zeek.dnp3",
        "dns"             => "zeek.dns",
        "dpd"             => "zeek.dpd",
        "files"           => "zeek.files",
        "ftp"             => "zeek.ftp",
        "http"            => "zeek.http",
        "intel"           => "zeek.intel",
        "irc"             => "zeek.irc",
        "kerberos"        => "zeek.kerberos",
        "known_certs"     => "zeek.known_certs",
        "known_hosts"     => "zeek.known_hosts",
        "known_services"  => "zeek.known_services",
        "modbus"          => "zeek.modbus",
        "mysql"           => "zeek.mysql",
        "notice"          => "zeek.notice",
        "ntlm"            => "zeek.ntlm",
        "ntp"             => "zeek.ntp",
        "ocsp"            => "zeek.ocsp",
        "pe"              => "zeek.pe",
        "postgresql"      => "zeek.postgresql",
        "quic"            => "zeek.quic",
        "radius"          => "zeek.radius",
        "rdp"             => "zeek.rdp",
        "rfb"             => "zeek.rfb",
        "signature"       => "zeek.signature",
        "sip"             => "zeek.sip",
        "smb_cmd"         => "zeek.smb_cmd",
        "smb_files"       => "zeek.smb_files",
        "smb_mapping"     => "zeek.smb_mapping",
        "smtp"            => "zeek.smtp",
        "snmp"            => "zeek.snmp",
        "socks"           => "zeek.socks",
        "software"        => "zeek.software",
        "ssh"             => "zeek.ssh",
        "ssl"             => "zeek.ssl",
        "stats"           => "zeek.stats",
        "syslog"          => "zeek.syslog",
        "traceroute"      => "zeek.traceroute",
        "tunnel"          => "zeek.tunnel",
        "weird"           => "zeek.weird",
        "websocket"       => "zeek.websocket",
        "x509"            => "zeek.x509",
      }

      # 排除 Logstash 元数据字段（不进入 zeek{} 嵌套透传）
      LS_META_KEYS = %w[@version @timestamp host message tags log event labels].freeze

      begin
        path  = event.get("[log][file][path]").to_s
        base  = File.basename(path, ".log")           # 例: conn / dce_rpc / smb_mapping
        dataset = DATASET_MAP[base] || "zeek.other"
        event.set("[event][dataset]", dataset)

        # event_id 用 zeek.uid 派生（Zeek uid 全局唯一，重推稳定），无 uid 时退化到 SecureRandom
        zeek_uid = event.get("uid").to_s
        event_id = zeek_uid.empty? ? "zeek-#{SecureRandom.uuid}" : "zeek-#{zeek_uid}"
        event.set("[@metadata][event_id]", event_id)

        # zeek{} 全量透传（保留 Zeek 原始字段，供下游"真伪判定"）
        # 注意：Logstash event 中 zeek JSON 字段是平铺的（如 id.orig_h / proto / uid），不嵌套
        zeek_raw = {}
        event.to_hash.each do |k, v|
          next if k.start_with?("@")
          next if LS_META_KEYS.include?(k)
          zeek_raw[k] = v unless v.nil? || (v.respond_to?(:empty?) && v.empty?)
        end
        # 显式包含事件 dataset（智能体要求 zeek.notice.msg 等路径）
        zeek_raw["dataset"] = dataset
        zeek_json = JSON.generate(zeek_raw)

        envelope = {
          "event_id" => event_id,
          "ts"       => event.get("@timestamp").to_s,
          "src_ip"   => event.get("id.orig_h").to_s,
          "src_port" => event.get("id.orig_p").to_s,
          "dst_ip"   => event.get("id.resp_h").to_s,
          "dst_port" => event.get("id.resp_p").to_s,
          "proto"    => event.get("proto").to_s,
          "dataset"  => dataset,
          "enriched" => "true",
          "zeek"     => zeek_json,
        }

        # XADD 重试 3 次（指数退避 0.1s/0.5s/2s），仍失败则落 DLQ（避免静默丢事件）
        attempts = 0
        max_attempts = 3
        begin
          attempts += 1
          @redis.xadd("analysis:events", envelope)
        rescue => e
          if attempts < max_attempts
            sleep([0.1, 0.5, 2.0][attempts - 1])
            retry
          end
          # 落 DLQ（append JSONL，含错误原因）
          begin
            FileUtils.mkdir_p(DLQ_DIR)
            File.open(DLQ_FILE, "a") do |f|
              f.puts(JSON.generate({
                "ts"      => Time.now.utc.iso8601(3),
                "error"   => "xadd_failed_after_#{max_attempts}_attempts: #{e.class}: #{e.message}",
                "envelope" => envelope,
              }))
            end
          rescue => dlq_err
            # DLQ 也失败：stderr 日志告警（运维侧需关注卷/权限）
            $stderr.puts("[zeek-pipeline] FATAL xadd failed AND dlq failed: #{e.message}; dlq: #{dlq_err.message}")
          end
        end
      rescue => e
        # 事件信封构造失败（非 XADD 错误），直接 stderr 不落 DLQ
        $stderr.puts("[zeek-pipeline] envelope construction failed: #{e.class}: #{e.message}; path=#{path rescue "<unknown>"}")
      end
    '
  }

  ## 富化标签占位（后续接入 IOC 匹配检测）
  mutate {
    add_field => { "labels" => "databus" }
  }
}

## 事件总线由 ruby filter 写入 Redis Stream（analysis:events）
## ES 主存储由 Elastic Agent（Zeek Integration）负责，避免重复写入
output {
  # 可选：控制台调试
  # stdout { codec => rubydebug }
}
