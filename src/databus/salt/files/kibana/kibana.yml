## ================================ General =====================================
server.name: kibana
server.host: 0.0.0.0
i18n.locale: zh-CN

# 加密 key 由容器 env XPACK_ENCRYPTEDSAVEDOBJECTS_ENCRYPTIONKEY 注入(Vault 派生),不入镜像
#
# 2026-09-10：移除 xpack.fleet.useSigningKey（Kibana 9.5.2 已删除该配置项，
#   启动即 FATAL: Additional properties are not allowed）。
#   该选项原用于绕过「旧 saved object 用旧密钥加密导致 EPM Install 卡死」，
#   全新部署 saved object 由当前 Vault 密钥新建，无历史残留，不再需要。
#
# 包仓库指向本地微型 EPR（nss-ndr-epr，看 containers/epr.sls）。
# 公网 epr.elastic.co 的 zeek-5.0.1 只声明 43 个 dataset；本项目
# images/zeek-integration/zeek-5.0.1 定制包声明 47 个（+analyzer/
# postgresql/quic/websocket）。该代理只对 zeek 打补丁，其余请求透传公网。
xpack.fleet:
  registryUrl: http://epr:8080
