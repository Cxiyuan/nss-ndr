# ============================================================================
# Redis 配置（nss-ndr/redis，方案 C：由 salt configs.sls 下发宿主机 bind）
# ----------------------------------------------------------------------------
# maxmemory-policy 选 volatile-lru 的原因（2026-09-11，analyze-agent 报告）：
#   原先 allkeys-lru —— 内存到顶时【无差别】淘汰任意 key，把 analyze-agent
#   的任务队列 tasks:analyze、幂等键 v2:seen:* 等无 TTL 的关键 key 静默删掉
#   （实测 evicted_keys=757，队列周期性整体消失、无任何告警）。
#   改为 volatile-lru —— 只淘汰【带 TTL】的 key，无 TTL 的队列/stream 受保护。
#
#   ⚠ 必须与「analysis:events 加 MAXLEN」同时生效（见 logstash pipeline）：
#     若 stream 无长度上限又不带 TTL，在 volatile-lru 下永不淘汰 → 内存照样
#     打满 → 但行为从「静默淘汰」变成「拒绝写入 OOM command not allowed」，
#     反而更糟。加了 MAXLEN 后 stream 上限约 51MB，1GB 上限余量充足。
#
# 注意：本文件必须由 containers/redis.sls 的 command 作为【第一个参数】传给
#       redis-server（redis-server /usr/local/etc/redis/redis.conf ...），否则
#       整个文件不生效（实测历史上就漏传了，导致 appendonly=no、无持久化）。
#       命令行参数优先于本文件，两边值保持一致。
# ============================================================================
bind 0.0.0.0
protected-mode yes
port 6379
appendonly yes
appendfsync everysec
maxmemory 1gb
maxmemory-policy volatile-lru
