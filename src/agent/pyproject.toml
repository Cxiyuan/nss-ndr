[project]
name = "nss-ndr-agent"
version = "0.1.0"
description = "深瞳安全分析智能体：基于 LangGraph 的后台常驻分析引擎"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.4",
    "pydantic>=2.7",
    "PyYAML>=6.0",
    "redis>=5.0",
    "elasticsearch>=8.13",
    "aiohttp>=3.9",
    "httpx>=0.27",
    "structlog>=24.1",
    "prometheus-client>=0.20",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "fakeredis>=2.23",
    "lupa>=2.0",          # fakeredis 的 Lua/EVAL 支持
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
