# NSS-NDR Fleet（对齐 SO 3.1.0：Fleet Server + Fleet 托管 elastic-agent）
#
# 启动顺序依赖：
#   ES/Kibana 就绪 -> fleet-init Job 供给（输出/策略/集成/令牌，写 Secret nss-fleet-enrollment）
#   -> fleet-server 用 es_service_token 启动 -> elastic-agent 用 enrollment_token 接入
#
# 供给顺序与 SO so-elastic-fleet-setup 一致（basic license 下按策略覆盖输出会被拒）：
#   ES 输出临时设为全局默认 -> 创建 fleet_server 集成 -> 把 FleetServer 策略输出钉到 ES
#   -> Logstash 恢复为全局默认（数据策略走 logstash，FleetServer 走 ES）。
#
# fleet-server 容器必需：FLEET_SERVER_ENABLE + FLEET_URL（自注册）+ FLEET_CA（TLS 信任）；
# 不得挂载 /usr/share/elastic-agent/data（遮蔽镜像内二进制软链）。

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: nss-fleet-init
  namespace: nss-ndr
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: nss-fleet-init
  namespace: nss-ndr
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: nss-fleet-init
  namespace: nss-ndr
subjects:
  - kind: ServiceAccount
    name: nss-fleet-init
    namespace: nss-ndr
roleRef:
  kind: Role
  name: nss-fleet-init
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nss-fleet-server
  namespace: nss-ndr
  labels:
    app: nss-fleet-server
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: nss-fleet-server
  template:
    metadata:
      labels:
        app: nss-fleet-server
    spec:
      containers:
        - name: fleet-server
          image: ghcr.io/cxiyuan/nss-ndr/nss-ndr-elastic-agent
          imagePullPolicy: IfNotPresent
          env:
            - name: FLEET_SERVER_ENABLE
              value: "true"
            - name: FLEET_URL
              value: "https://nss-fleet-server:8220"
            - name: FLEET_SERVER_ELASTICSEARCH_HOST
              value: "http://nss-elasticsearch:9200"
            - name: FLEET_SERVER_SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: nss-fleet-enrollment
                  key: es_service_token
            - name: FLEET_SERVER_POLICY_ID
              value: "FleetServer-nss"
            - name: FLEET_SERVER_CERT
              value: "/etc/elastic-agent/certs/fleet-server.crt"
            - name: FLEET_SERVER_CERT_KEY
              value: "/etc/elastic-agent/certs/fleet-server.key"
            - name: FLEET_CA
              value: "/etc/elastic-agent/certs/ca.crt"
            - name: FLEET_SERVER_HOST
              value: "0.0.0.0"
            - name: FLEET_SERVER_PORT
              value: "8220"
          ports:
            - containerPort: 8220
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: certs
              mountPath: /etc/elastic-agent/certs
              readOnly: true
      volumes:
        - name: certs
          secret:
            secretName: nss-ndr-certs
---
apiVersion: v1
kind: Service
metadata:
  name: nss-fleet-server
  namespace: nss-ndr
spec:
  selector:
    app: nss-fleet-server
  ports:
    - port: 8220
      targetPort: 8220
---
apiVersion: batch/v1
kind: Job
metadata:
  name: nss-fleet-init
  namespace: nss-ndr
  labels:
    app: nss-fleet-init
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      serviceAccountName: nss-fleet-init
      restartPolicy: OnFailure
      containers:
        - name: fleet-init
          image: ghcr.io/cxiyuan/nss-ndr/nss-ndr-fleet-init
          imagePullPolicy: IfNotPresent
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: KIBANA_URL
              value: "http://nss-kibana:5601"
            - name: ES_USER
              value: "elastic"
            - name: ES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: nss-ndr-secrets
                  key: elastic-password
            - name: NAMESPACE
              value: "nss-ndr"
            - name: SECRET_NAME
              value: "nss-fleet-enrollment"
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
          volumeMounts:
            - name: certs
              mountPath: /etc/elastic-agent/certs
              readOnly: true
      volumes:
        - name: certs
          secret:
            secretName: nss-ndr-certs
