apiVersion: batch/v1
kind: CronJob
metadata:
  name: nss-cleaner
  namespace: nss-ndr
  labels:
    app: nss-cleaner
spec:
  schedule: "0 * * * *"          # 每小时（实际阈值由 probe.yaml 控制）
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 300
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          tolerations:
            - operator: Exists
          containers:
            - name: cleaner
              image: ghcr.io/cxiyuan/nss-ndr/nss-ndr-cleaner
              imagePullPolicy: IfNotPresent
              volumeMounts:
                - name: config
                  mountPath: /opt/so/conf
                  readOnly: true
                - name: nsm
                  mountPath: /nsm
                - name: state
                  mountPath: /opt/so/state
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits:
                  cpu: 500m
                  memory: 256Mi
          volumes:
            - name: config
              configMap:
                name: nss-ndr-config
            - name: nsm
              persistentVolumeClaim:
                claimName: nss-ndr-nsm
            - name: state
              hostPath:
                path: /opt/so/state
                type: DirectoryOrCreate
