apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - 00-namespace.yaml
  - 10-configmap.yaml
  - 20-pv-pvc.yaml
  - 30-suricata-daemonset.yaml
  - 31-zeek-daemonset.yaml

# 镜像 tag 覆盖：构建后把 newTag 改为对应 git sha 以固定版本
images:
  - name: ghcr.io/cxiyuan/nss-ndr-suricata
    newTag: latest
  - name: ghcr.io/cxiyuan/nss-ndr-zeek
    newTag: latest
