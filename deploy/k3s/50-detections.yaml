apiVersion: apps/v1
kind: Deployment
metadata:
  name: nss-detections
  namespace: nss-ndr
  labels:
    app: nss-detections
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nss-detections
  template:
    metadata:
      labels:
        app: nss-detections
    spec:
      containers:
        - name: detections
          image: ghcr.io/cxiyuan/nss-ndr-detections
          imagePullPolicy: IfNotPresent
          env:
            - name: LISTEN_ADDR
              value: ":8080"
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: config
              mountPath: /opt/so/conf
              readOnly: true
            - name: rules
              mountPath: /opt/so/rules/suricata
            - name: run
              mountPath: /var/run/suricata
            - name: state
              mountPath: /opt/so/state
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
      volumes:
        - name: config
          configMap:
            name: nss-ndr-config
        - name: rules
          hostPath:
            path: /opt/so/rules/suricata
            type: DirectoryOrCreate
        - name: run
          hostPath:
            path: /opt/so/run/suricata
            type: DirectoryOrCreate
        - name: state
          hostPath:
            path: /opt/so/state
            type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: nss-detections
  namespace: nss-ndr
spec:
  type: NodePort
  selector:
    app: nss-detections
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30602
