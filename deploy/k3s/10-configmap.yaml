apiVersion: v1
kind: ConfigMap
metadata:
  name: nss-ndr-config
  namespace: nss-ndr
data:
  suricata.yaml: "# NSS-NDR Suricata 配置模板\n# 由 scripts/render-configs.py 从 probe.yaml\
    \ 渲染（${VAR} 为占位符）\n\n%YAML 1.1\n---\n\ndefault-log-dir: /var/log/suricata/\n\n\
    runmode: workers\nmax-pending-packets: 5000\ndefault-packet-size: 9014\n\nhost-mode:\
    \ auto\n\naf-packet:\n  - interface: bond0\n    cluster-id: 59\n    cluster-type:\
    \ cluster_flow\n    defrag: true\n    use-mmap: true\n    mmap-locked: false\n\
    \    threads: 4\n    tpacket-v3: true\n    ring-size: 5000\n    block-size: 69632\n\
    \    block-timeout: 10\n    use-emergency-flush: true\n    buffer-size: 32768\n\
    \    disable-promisc: false\n    checksum-checks: kernel\n\nvars:\n  address-groups:\n\
    \    HOME_NET: [10.0.0.0/8,192.168.0.0/16,172.16.0.0/12]\n    EXTERNAL_NET: any\n\
    \    HTTP_SERVERS: \"$HOME_NET\"\n    SMTP_SERVERS: \"$HOME_NET\"\n    SQL_SERVERS:\
    \ \"$HOME_NET\"\n    DNS_SERVERS: \"$HOME_NET\"\n    TELNET_SERVERS: \"$HOME_NET\"\
    \n    AIM_SERVERS: \"$EXTERNAL_NET\"\n    DC_SERVERS: \"$HOME_NET\"\n    DNP3_SERVER:\
    \ \"$HOME_NET\"\n    DNP3_CLIENT: \"$HOME_NET\"\n    MODBUS_CLIENT: \"$HOME_NET\"\
    \n    MODBUS_SERVER: \"$HOME_NET\"\n    ENIP_CLIENT: \"$HOME_NET\"\n    ENIP_SERVER:\
    \ \"$HOME_NET\"\n  port-groups:\n    HTTP_PORTS: 80\n    SHELLCODE_PORTS: \"!80\"\
    \n    ORACLE_PORTS: 1521\n    SSH_PORTS: 22\n    DNP3_PORTS: 20000\n    MODBUS_PORTS:\
    \ 502\n    FILE_DATA_PORTS: \"[$HTTP_PORTS,110,143]\"\n    FTP_PORTS: 21\n   \
    \ VXLAN_PORTS: 4789\n    TEREDO_PORTS: 3544\n    SIP_PORTS: \"[5060,5061]\"\n\
    \    GENEVE_PORTS: 6081\n\noutputs:\n  - fast:\n      enabled: no\n      filename:\
    \ fast.log\n      append: yes\n  - eve-log:\n      enabled: yes\n      filetype:\
    \ regular\n      filename: /nsm/suricata/eve-%Y-%m-%d-%H:%M.json\n      rotate-interval:\
    \ hour\n      pcap-file: false\n      community-id: true\n      community-id-seed:\
    \ 0\n      types:\n        - alert:\n            payload: false\n            payload-buffer-size:\
    \ 4kb\n            payload-printable: true\n            packet: true\n       \
    \     metadata:\n              app-layer: false\n              flow: false\n \
    \             rule:\n                metadata: true\n                raw: true\n\
    \            tagged-packets: false\n            xff:\n              enabled: false\n\
    \              mode: extra-data\n              deployment: reverse\n         \
    \     header: X-Forwarded-For\n        - stats:\n            enabled: yes\n  \
    \          filename: stats.log\n            append: yes\n            totals: yes\n\
    \            threads: no\n            null-values: yes\n  - file-store:\n    \
    \  version: 2\n      enabled: no\n      dir: /nsm/extracted\n  - pcap-log:\n \
    \     enabled: yes\n      filetype: regular\n      filename: \"%n/so-pcap.%t\"\
    \n      limit: 1000mb\n      mode: multi\n      use-stream-depth: false\n    \
    \  compression: none\n      lz4-checksum: false\n      lz4-level: 8\n      dir:\
    \ /nsm/suripcap\n      max-files: 125\n\napp-layer:\n  protocols:\n    tls:\n\
    \      enabled: yes\n      detection-ports:\n        dp: 443\n      ja3-fingerprints:\
    \ auto\n      ja4-fingerprints: auto\n      encryption-handling: track-only\n\
    \    http:\n      enabled: yes\n      libhtp:\n        default-config:\n     \
    \     personality: IDS\n          request-body-limit: 100 KiB\n          response-body-limit:\
    \ 100 KiB\n    dns:\n      global-memcap: 16mb\n      state-memcap: 512kb\n  \
    \    request-flood: 500\n      tcp:\n        enabled: yes\n        detection-ports:\n\
    \          dp: 53\n      udp:\n        enabled: yes\n        detection-ports:\n\
    \          dp: 53\n    smb:\n      enabled: yes\n      detection-ports:\n    \
    \    dp: 139, 445\n    smtp:\n      enabled: yes\n      raw-extraction: false\n\
    \      mime:\n        decode-mime: true\n        decode-base64: true\n       \
    \ decode-quoted-printable: true\n        header-value-depth: 2000\n        extract-urls:\
    \ true\n        body-md5: false\n    ssh:\n      enabled: yes\n    dcerpc:\n \
    \     enabled: yes\n    modbus:\n      enabled: yes\n      detection-ports:\n\
    \        dp: 502\n      stream-depth: 0\n    dnp3:\n      enabled: yes\n     \
    \ detection-ports:\n        dp: 20000\n    enip:\n      enabled: yes\n      detection-ports:\n\
    \        dp: 44818\n        sp: 44818\n    ntp:\n      enabled: yes\n    dhcp:\n\
    \      enabled: yes\n    sip:\n      enabled: yes\n    http2:\n      enabled:\
    \ yes\n\nlogging:\n  default-log-level: notice\n  outputs:\n    - console:\n \
    \       enabled: yes\n    - file:\n        enabled: yes\n        level: info\n\
    \        filename: suricata.log\n    - syslog:\n        enabled: no\n        facility:\
    \ local5\n\nrun-as:\n  user: suricata\n  group: suricata\n\ncoredump:\n  max-dump:\
    \ unlimited\n\nlegacy:\n  uricontent: enabled\n\nengine-analysis:\n  rules-fast-pattern:\
    \ true\n  rules: true\n\npcre:\n  match-limit: 3500\n  match-limit-recursion:\
    \ 1500\n\ndefault-rule-path: /etc/suricata/rules\nrule-files:\n  - all-rulesets.rules\n\
    classification-file: /etc/suricata/classification.config\nreference-config-file:\
    \ /etc/suricata/reference.config\nthreshold-file: /etc/suricata/threshold.conf\n"
  threshold.conf: '# NSS-NDR Suricata threshold/suppress 配置（默认空）

    # 由 detections 服务（M2）写入

    '
  local.zeek: '##! NSS-NDR Zeek 站点策略（M0 最小集）


    @load misc/loaded-scripts

    @load misc/capture-loss


    # Community ID（内置）+ 扩展

    @load policy/frameworks/notice/community-id

    @load policy/protocols/conn/community-id-logging


    # NSS-NDR 自研策略

    @load securityonion/json-logs

    @load securityonion/conn-add-sensorname

    @load securityonion/community-id-extended

    @load securityonion/bpfconf

    @load securityonion/file-extraction


    # 指纹与协议插件（so-zeek 基础镜像已安装，按需启用）

    @load ja3

    @load ja4

    @load hassh

    @load oui-logging


    redef LogAscii::json_timestamps = JSON::TS_ISO8601;

    redef CaptureLoss::watch_interval = 5 mins;

    '
  node.cfg: '# NSS-NDR Zeek node.cfg（由 render-configs.py 渲染）


    [manager]

    type=manager

    host=localhost


    [logger]

    type=logger

    host=localhost


    [proxy]

    type=proxy

    host=localhost


    [worker-1]

    type=worker

    host=localhost

    interface=af_packet::bond0

    lb_method=custom

    lb_procs=4

    af_packet_fanout_id=23

    af_packet_fanout_mode=AF_Packet::FANOUT_HASH

    af_packet_buffer_size=128*1024*1024

    '
  zeekctl.cfg: '## Global ZeekControl configuration file


    CfgDir = /opt/zeek/etc

    LogDir = /nsm/zeek/logs

    SpoolDir = /nsm/zeek/spool

    SitePolicyScripts = local.zeek


    LogRotationInterval = 3600

    CompressLogs = 1

    LogExpireInterval = 0


    StatsLogEnable = 1

    StatsLogExpireInterval = 0

    StatusCmdShowAll = 0

    CrashExpireInterval = 0


    MailTo = root@localhost

    MailConnectionSummary = 0

    MailHostUpDown = 0

    MinDiskSpace = 5


    ZeekPort = 27760

    FileExtractDir =

    '
  networks.cfg: '# NSS-NDR Zeek networks.cfg（由 render-configs.py 渲染）

    10.0.0.0/8 Private_IP_Space

    192.168.0.0/16 Private_IP_Space

    172.16.0.0/12 Private_IP_Space

    '
  policy/securityonion/community-id-extended.zeek: "##! NSS-NDR：把连接级 Community ID\
    \ 扩展到 Files 与 SSL 日志，便于跨引擎/跨日志关联\n\nmodule NSSNDR;\n\n@load base/protocols/ssl\n\
    @load policy/protocols/conn/community-id-logging\n\nexport {\n    redef record\
    \ SSL::Info += {\n        community_id: string &log &optional;\n    };\n\n   \
    \ redef record Files::Info += {\n        community_id: string &log &optional;\n\
    \    };\n}\n\nevent file_new(f: fa_file)\n    {\n    if ( ! f?$conns )\n     \
    \   return;\n    for ( cid in f$conns )\n        {\n        local c = f$conns[cid];\n\
    \        if ( c?$conn && c$conn?$community_id )\n            {\n            f$info$community_id\
    \ = c$conn$community_id;\n            break;\n            }\n        }\n    }\n\
    \nevent ssl_established(c: connection)\n    {\n    if ( c?$conn && c$conn?$community_id\
    \ && c?$ssl )\n        c$ssl$community_id = c$conn$community_id;\n    }\n"
  policy/securityonion/bpfconf.zeek: "##! NSS-NDR：从 /opt/zeek/etc/bpf 动态加载 BPF 过滤（可热重载）\n\
    \nmodule NSSNDR;\n\n@load base/frameworks/notice\n\nexport {\n    const bpf_conf_file\
    \ = \"/opt/zeek/etc/bpf\" &redef;\n\n    redef enum Notice::Type += {\n      \
    \  InvalidBPF\n    };\n}\n\nglobal filter_parts: vector of string = vector();\n\
    global current_file = \"\";\n\nredef enum PcapFilterID += {\n    NSSNDR_BPF\n\
    };\n\nevent line(description: Input::EventDescription, tpe: Input::Event, s: string)\n\
    \    {\n    local part = sub(s, /[[:blank:]]*#.*$/, \"\");\n    if ( part != \"\
    \" )\n        filter_parts[|filter_parts|] = part;\n    }\n\nevent Input::end_of_data(name:\
    \ string, source: string)\n    {\n    if ( name != \"nssndr-bpf\" )\n        return;\n\
    \    local filter = join_string_vec(filter_parts, \" \");\n    filter_parts =\
    \ vector();\n    if ( filter == \"\" )\n        return;\n\n    if ( Pcap::precompile_pcap_filter(NSSNDR_BPF,\
    \ filter) )\n        {\n        capture_filters[\"bpf.conf\"] = filter;\n    \
    \    PacketFilter::install();\n        }\n    else\n        NOTICE([$note=InvalidBPF,\n\
    \                $msg=fmt(\"Compiling BPF from %s failed: %s\", bpf_conf_file,\
    \ filter),\n                $sub=filter]);\n    }\n\nevent zeek_init() &priority=5\n\
    \    {\n    if ( bpf_conf_file == \"\" )\n        return;\n    if ( bpf_conf_file\
    \ != current_file )\n        {\n        current_file = bpf_conf_file;\n      \
    \  Input::add_event([$source=bpf_conf_file,\n                          $name=\"\
    nssndr-bpf\",\n                          $reader=Input::READER_RAW,\n        \
    \                  $mode=Input::REREAD,\n                          $want_record=F,\n\
    \                          $fields=record { s: string; },\n                  \
    \        $ev=line]);\n        }\n    }\n"
  policy/securityonion/json-logs.zeek: '##! NSS-NDR：Zeek 输出 JSON 格式日志（整条管道的根基）


    @load tuning/json-logs


    redef LogAscii::use_json = T;

    redef LogAscii::json_timestamps = JSON::TS_ISO8601;

    '
  policy/securityonion/conn-add-sensorname.zeek: "##! NSS-NDR：为连接记录注入探针标识（observer.name），支持多探针溯源\n\
    \nmodule NSSNDR;\n\nexport {\n    ## 探针标识（由环境变量 NSS_SENSORNAME 注入）\n    const\
    \ sensorname = \"\" &redef;\n\n    redef record Conn::Info += {\n        sensorname:\
    \ string &log &optional;\n    };\n}\n\nevent connection_state_remove(c: connection)\n\
    \    {\n    if ( ! c?$conn )\n        return;\n    c$conn$sensorname = NSSNDR::sensorname;\n\
    \    }\n\nevent zeek_init()\n    {\n    # 由环境变量 NSS_SENSORNAME 注入，缺省用主机名\n   \
    \ if ( getenv(\"NSS_SENSORNAME\") != \"\" )\n        NSSNDR::sensorname = getenv(\"\
    NSS_SENSORNAME\");\n    else\n        NSSNDR::sensorname = getenv(\"HOSTNAME\"\
    );\n    }\n"
  policy/securityonion/file-extraction/__load__.zeek: '@load extract

    '
  policy/securityonion/file-extraction/extract.zeek: "##! NSS-NDR：按 MIME 白名单提取网络文件到\
    \ /nsm/zeek/extracted/complete/\n##! 文件需完整（md5 存在、字节数非 0、未超时），否则删除临时文件\n\nmodule\
    \ NSSNDR;\n\n@load base/frameworks/files\n@load base/frameworks/exec\n\nexport\
    \ {\n    redef FileExtract::prefix = \"/nsm/zeek/extracted/\";\n    redef FileExtract::default_limit\
    \ = 9000000;\n\n    ## MIME 白名单：mime -> 扩展名\n    const file_extraction_mimes:\
    \ table[string] of string = {\n        [\"application/x-dosexec\"] = \"exe\",\n\
    \        [\"application/pdf\"] = \"pdf\",\n        [\"application/msword\"] =\
    \ \"doc\",\n        [\"application/vnd.ms-excel\"] = \"xls\",\n        [\"application/rtf\"\
    ] = \"rtf\",\n        [\"application/zip\"] = \"zip\",\n        [\"application/x-7z-compressed\"\
    ] = \"7z\",\n        [\"application/x-rar-compressed\"] = \"rar\",\n        [\"\
    application/vnd.openxmlformats-officedocument.wordprocessingml.document\"] = \"\
    docx\",\n        [\"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet\"\
    ] = \"xlsx\",\n        [\"application/vnd.openxmlformats-officedocument.presentationml.presentation\"\
    ] = \"pptx\"\n    } &redef;\n}\n\nevent file_sniff(f: fa_file, meta: fa_metadata)\
    \ &priority=10\n    {\n    if ( ! meta?$mime_type )\n        return;\n    if (\
    \ meta$mime_type !in file_extraction_mimes )\n        return;\n\n    local fname\
    \ = fmt(\"%s-%s.%s\", f$source, f$id, file_extraction_mimes[meta$mime_type]);\n\
    \    Files::add_analyzer(f, Files::ANALYZER_EXTRACT, [$extract_filename=fname]);\n\
    \    }\n\nevent file_state_remove(f: fa_file)\n    {\n    if ( ! f$info?$extracted\
    \ || FileExtract::prefix == \"\" )\n        return;\n\n    # 不完整/超时/零字节 直接丢弃\n\
    \    if ( ! f$info?$md5 ||\n         (f?$total_bytes && f$total_bytes == 0) ||\n\
    \         f$missing_bytes > 0 ||\n         f$info$timedout )\n        {\n    \
    \    local nuke = fmt(\"rm -f %s/%s\", FileExtract::prefix, f$info$extracted);\n\
    \        when [nuke] ( local r = Exec::run([$cmd=nuke]) ) { }\n        return;\n\
    \        }\n\n    local orig = f$info$extracted;\n    local parts = split_string(orig,\
    \ /\\./);\n    local ext = parts[|parts|-1];\n    local dest = fmt(\"%scomplete/%s-%s-%s.%s\"\
    ,\n                     FileExtract::prefix, f$source, f$id, f$info$md5, ext);\n\
    \    local move = fmt(\"cp %s/%s %s && rm -f %s/%s\",\n                     FileExtract::prefix,\
    \ orig, dest, FileExtract::prefix, orig);\n    when [move] ( local mv = Exec::run([$cmd=move])\
    \ ) { }\n    f$info$extracted = dest;\n    }\n"
  bpf: ''
  all-rulesets.rules: ''
  sensor_id: nss-001
  interface: bond0
  probe.yaml: "# NSS-NDR 探针配置文件（示例）\n# 修改后运行：python3 scripts/render-configs.py configs/probe.yaml\
    \ deploy/k3s/10-configmap.yaml\n\nprobe:\n  id: nss-001                 # 探针唯一标识（observer.name\
    \ / 推送标记）\n  interface: bond0            # 镜像口（抓包网卡）\n  home_net:            \
    \       # HOME_NET 地址组\n    - 10.0.0.0/8\n    - 192.168.0.0/16\n    - 172.16.0.0/12\n\
    \  external_net: any           # EXTERNAL_NET\n  bpf: \"\"                   \
    \  # 可选 BPF 过滤（如 \"not port 22\"）\n  min_free_gb: 20             # 磁盘低水位告警（GB）\n\
    \  disk_pressure_threshold: 90 # /nsm 用量百分比，超过触发强制清理（兜底）\n  cleanup_interval:\
    \ \"1h\"      # cleaner 扫描周期\n\nsuricata:\n  enabled: true\n  af_packet_threads:\
    \ 4        # AF_PACKET worker 数\n  pcap:\n    enabled: true\n    file_size_mb:\
    \ 1000        # 全包单文件大小\n    compression: none         # none | lz4\n    retention_days:\
    \ 7         # 全包留存天数\n    storage_limit_gb: 500     # 全包目录存储上限（GB）\n  eve:\n \
    \   retention_days: 7         # eve.json 留档天数\n\nzeek:\n  enabled: true\n  workers:\
    \ 4                  # Zeek worker 数（AF_PACKET fanout）\n  buffer_size: 128*1024*1024\
    \  # AF_PACKET 缓冲区\n  log_rotation_interval_s: 3600\n  history_retention_days:\
    \ 30  # 轮转历史留档天数\n  extraction:\n    max_days: 7               # 提取文件留档天数\n\n\
    elasticsearch:\n  heap_gb: 2\n  retention:\n    metadata_days: 60         # ES\
    \ ILM：元数据\n    alerts_days: 365          # ES ILM：告警\n\ndetections:\n  default_ruleset:\
    \ none       # 默认不加载任何规则（M2 启用）\n\nxdr:\n  webhook:\n    url: https://xdr.example.com/api/v1/alerts/webhook\
    \   # XDR 接收地址（可改）\n    secret: \"\"                                         \
    \ # 可选 HMAC 签名密钥\n  timeout_s: 10\n  push_interval_s: 2          # 告警轮询/推送周期\n\
    \  retry_max: 5\n  event_types:                # 推送白名单\n    - suricata.alert\n\
    \    - zeek.notice\n"
