apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: nss-suricata
  namespace: nss-ndr
  labels:
    app: nss-suricata
spec:
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: nss-suricata
  template:
    metadata:
      labels:
        app: nss-suricata
    spec:
      hostNetwork: true
      tolerations:
        - operator: Exists
      containers:
        - name: suricata
          # 由 GitHub Actions 构建并推送至 GHCR（见 .github/workflows/build-images.yml）
          # tag 通过 kustomization.yaml 的 images 覆盖（默认 latest）
          image: ghcr.io/cxiyuan/nss-ndr/nss-ndr-suricata
          imagePullPolicy: IfNotPresent
          securityContext:
            privileged: true
          env:
            - name: INTERFACE
              valueFrom:
                configMapKeyRef:
                  name: nss-ndr-config
                  key: interface
            - name: NSS_SENSORNAME
              valueFrom:
                configMapKeyRef:
                  name: nss-ndr-config
                  key: sensor_id
          volumeMounts:
            - name: config
              mountPath: /opt/so/conf
              readOnly: true
            - name: nsm
              mountPath: /nsm
            - name: rules
              mountPath: /etc/suricata/rules
            - name: run
              mountPath: /var/run/suricata
          resources:
            limits:
              cpu: "4"
              memory: 4Gi
            requests:
              cpu: 100m
              memory: 256Mi
      volumes:
        - name: config
          configMap:
            name: nss-ndr-config
        - name: nsm
          persistentVolumeClaim:
            claimName: nss-ndr-nsm
        # 规则目录（detections 服务写入，suricata 读取）
        - name: rules
          hostPath:
            path: /opt/so/rules/suricata
            type: DirectoryOrCreate
        # suricata unix command socket（detections 触发 reload）
        - name: run
          hostPath:
            path: /opt/so/run/suricata
            type: DirectoryOrCreate
