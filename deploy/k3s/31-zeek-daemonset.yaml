apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: nss-zeek
  namespace: nss-ndr
  labels:
    app: nss-zeek
spec:
  selector:
    matchLabels:
      app: nss-zeek
  template:
    metadata:
      labels:
        app: nss-zeek
    spec:
      hostNetwork: true
      tolerations:
        - operator: Exists
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: zeek
          # 由 GitHub Actions 构建并推送至 GHCR（见 .github/workflows/build-images.yml）
          # tag 通过 kustomization.yaml 的 images 覆盖（默认 latest）
          image: ghcr.io/cxiyuan/nss-ndr-zeek
          imagePullPolicy: IfNotPresent
          securityContext:
            privileged: true
          env:
            - name: NSS_SENSORNAME
              valueFrom:
                configMapKeyRef:
                  name: nss-ndr-config
                  key: sensor_id
          volumeMounts:
            - name: config
              mountPath: /opt/so/conf
              readOnly: true
            - name: nsm
              mountPath: /nsm
          resources:
            limits:
              cpu: "4"
              memory: 4Gi
            requests:
              cpu: "2"
              memory: 2Gi
      volumes:
        - name: config
          configMap:
            name: nss-ndr-config
        - name: nsm
          persistentVolumeClaim:
            claimName: nss-ndr-nsm
