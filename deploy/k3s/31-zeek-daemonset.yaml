apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: nss-zeek
  namespace: nss-ndr
  labels:
    app: nss-zeek
spec:
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: nss-zeek
  template:
    metadata:
      labels:
        app: nss-zeek
    spec:
      hostNetwork: true
      tolerations:
        - operator: Exists
      containers:
        - name: zeek
          # 由 GitHub Actions 构建并推送至 GHCR（见 .github/workflows/build-images.yml）
          # tag 通过 kustomization.yaml 的 images 覆盖（默认 latest）
          image: ghcr.io/cxiyuan/nss-ndr/nss-ndr-zeek
          imagePullPolicy: IfNotPresent
          securityContext:
            privileged: true
          env:
            - name: NSS_SENSORNAME
              valueFrom:
                configMapKeyRef:
                  name: nss-ndr-config
                  key: sensor_id
          volumeMounts:
            - name: config
              mountPath: /opt/so/conf
              readOnly: true
            - name: nsm
              mountPath: /nsm
          resources:
            limits:
              cpu: "4"
              memory: 4Gi
            requests:
              cpu: 500m
              memory: 256Mi
      volumes:
        - name: config
          configMap:
            name: nss-ndr-config
            # ConfigMap key 不允许 "/"，policy 文件已扁平化（policy_securityonion_*），
            # 这里用 items[].path 还原 /opt/so/conf/policy/securityonion/ 目录结构
            items:
              - key: local.zeek
                path: local.zeek
              - key: node.cfg
                path: node.cfg
              - key: zeekctl.cfg
                path: zeekctl.cfg
              - key: networks.cfg
                path: networks.cfg
              - key: bpf
                path: bpf
              - key: config.zeek
                path: config.zeek
              - key: policy_securityonion_community-id-extended.zeek
                path: policy/securityonion/community-id-extended.zeek
              - key: policy_securityonion_bpfconf.zeek
                path: policy/securityonion/bpfconf.zeek
              - key: policy_securityonion_json-logs.zeek
                path: policy/securityonion/json-logs.zeek
              - key: policy_securityonion_conn-add-sensorname.zeek
                path: policy/securityonion/conn-add-sensorname.zeek
              - key: policy_securityonion_file-extraction___load__.zeek
                path: policy/securityonion/file-extraction/__load__.zeek
              - key: policy_securityonion_file-extraction_extract.zeek
                path: policy/securityonion/file-extraction/extract.zeek
              - key: policy_cve-2020-0601___load__.zeek
                path: policy/cve-2020-0601/__load__.zeek
              - key: policy_cve-2020-0601_cve-2020-0601.zeek
                path: policy/cve-2020-0601/cve-2020-0601.zeek
              - key: policy_cve-2020-0601_COPYING
                path: policy/cve-2020-0601/COPYING
              - key: policy_intel___load__.zeek
                path: policy/intel/__load__.zeek
              - key: policy_intel_intel.dat
                path: policy/intel/intel.dat
        - name: nsm
          persistentVolumeClaim:
            claimName: nss-ndr-nsm
