# NSS-NDR MCP Server：向本地 Agent 暴露分析工具集（查询本地 ES 元数据）
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nss-mcp-server
  namespace: nss-ndr
  labels:
    app: nss-mcp-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nss-mcp-server
  template:
    metadata:
      labels:
        app: nss-mcp-server
    spec:
      containers:
        - name: mcp-server
          image: ghcr.io/cxiyuan/nss-ndr/nss-ndr-mcp-server
          imagePullPolicy: IfNotPresent
          env:
            - name: ES_HOST
              value: "http://nss-elasticsearch:9200"
            - name: ES_USERNAME
              value: "xdr-push"
            - name: ES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: nss-ndr-secrets
                  key: xdr-push-password
          ports:
            - containerPort: 8000
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: nss-mcp-server
  namespace: nss-ndr
spec:
  selector:
    app: nss-mcp-server
  ports:
    - port: 8000
      targetPort: 8000
      name: mcp
