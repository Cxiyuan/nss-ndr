# NSS-NDR 数据卷
# M0 默认使用 k3s 内置 local-path（零配置）。生产建议按注释改用 hostPath/LocalPV：
#   1) 在节点上准备 /nsm 数据盘（建议独立挂载）
#   2) 将下面的 PVC 的 storageClassName 改为 local-nsm，并创建对应 PV（见文件尾部注释）

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nss-ndr-nsm
  namespace: nss-ndr
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 1000Gi
---
# ES 数据卷（M1，本地检索）
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nss-ndr-es-data
  namespace: nss-ndr
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 200Gi
---
