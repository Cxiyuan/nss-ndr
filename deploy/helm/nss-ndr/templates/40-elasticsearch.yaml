apiVersion: apps/v1
kind: Deployment
metadata:
  name: nss-elasticsearch
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  selector:
    matchLabels: {app: nss-elasticsearch}
  template:
    metadata:
      labels: {app: nss-elasticsearch}
    spec:
      imagePullSecrets: {{ toYaml .Values.images.pullSecrets | nindent 8 }}
      containers:
        - name: elasticsearch
          image: {{ .Values.images.elasticsearch }}
          env:
            - {name: node.name, value: nss-es}
            - {name: cluster.name, value: nss-ndr}
            - {name: discovery.type, value: single-node}
            - {name: xpack.security.enabled, value: "true"}
            - name: ELASTIC_PASSWORD
              valueFrom: {secretKeyRef: {name: nss-ndr-secrets, key: elastic-password}}
            - name: ES_JAVA_OPTS
              value: "-Xms{{ .Values.probeConfig.elasticsearch.heap_gb }}g -Xmx{{ .Values.probeConfig.elasticsearch.heap_gb }}g"
            - {name: ingest.geoip.downloader.enabled, value: "false"}
          ports:
            - {containerPort: 9200, name: http}
            - {containerPort: 9300, name: transport}
          volumeMounts:
            - {name: data, mountPath: /usr/share/elasticsearch/data}
        - name: es-init
          image: "{{ .Values.images.registry }}/nss-ndr-es-init:{{ .Values.images.tag }}"
          imagePullPolicy: IfNotPresent
          env:
            - {name: ES_URL, value: "http://localhost:9200"}
            - {name: ES_SECURITY, value: "true"}
            - {name: ES_USER, value: "elastic"}
            - name: ES_PASS
              valueFrom: {secretKeyRef: {name: nss-ndr-secrets, key: elastic-password}}
            - name: FB_PASSWORD
              valueFrom: {secretKeyRef: {name: nss-ndr-secrets, key: filebeat-password}}
            - name: KIBANA_PASSWORD
              valueFrom: {secretKeyRef: {name: nss-ndr-secrets, key: kibana-password}}
            - name: XDR_PASSWORD
              valueFrom: {secretKeyRef: {name: nss-ndr-secrets, key: xdr-push-password}}
      volumes:
        - {name: data, persistentVolumeClaim: {claimName: nss-ndr-es-data}}
---
apiVersion: v1
kind: Service
metadata:
  name: nss-elasticsearch
  namespace: {{ .Release.Namespace }}
spec:
  selector: {app: nss-elasticsearch}
  ports:
    - {port: 9200, targetPort: 9200, name: http}
    - {port: 9300, targetPort: 9300, name: transport}
