apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: nss-elastic-agent
  namespace: {{ .Release.Namespace }}
spec:
  revisionHistoryLimit: 2
  selector:
    matchLabels: {app: nss-elastic-agent}
  template:
    metadata:
      labels: {app: nss-elastic-agent}
    spec:
      tolerations: [{operator: Exists}]
      imagePullSecrets: {{ toYaml .Values.images.pullSecrets | nindent 8 }}
      containers:
        - name: elastic-agent
          image: "{{ .Values.images.registry }}/nss-ndr-elastic-agent:{{ .Values.images.tag }}"
          imagePullPolicy: IfNotPresent
          env:
            - name: NSS_SENSORNAME
              valueFrom: {configMapKeyRef: {name: nss-ndr-config, key: sensor_id}}
            - {name: FLEET_ENROLL, value: "1"}
            - {name: FLEET_URL, value: "https://nss-fleet-server:8220"}
            - name: FLEET_ENROLLMENT_TOKEN
              valueFrom: {secretKeyRef: {name: nss-fleet-enrollment, key: enrollment_token}}
            - {name: FLEET_CA, value: "/etc/elastic-agent/certs/ca.crt"}
          volumeMounts:
            - {name: nsm, mountPath: /nsm, readOnly: true}
            - {name: certs, mountPath: /etc/elastic-agent/certs, readOnly: true}
          resources:
            requests: {memory: 256Mi}
            limits: {memory: 1Gi}
      volumes:
        - {name: nsm, persistentVolumeClaim: {claimName: nss-ndr-nsm}}
        - {name: certs, secret: {secretName: nss-ndr-certs}}
