# NSS-NDR Strelka 文件静态分析（参照 Security Onion 3.1.0 架构）
{{- if .Values.probeConfig.strelka.enabled }}
{{- $backendReplicas := default 1 (.Values.probeConfig.strelka.backend_replicas | int) }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nss-strelka-coordinator
  namespace: {{ .Release.Namespace }}
  labels: {app: nss-strelka-coordinator}
spec:
  replicas: 1
  selector:
    matchLabels: {app: nss-strelka-coordinator}
  template:
    metadata:
      labels: {app: nss-strelka-coordinator}
    spec:
      imagePullSecrets: {{ toYaml .Values.images.pullSecrets | nindent 8 }}
      initContainers:
        - name: prepare-data
          image: docker.io/library/busybox:1.36
          command: ["sh", "-c", "mkdir -p /nsm/strelka/coord-redis-data && chown -R 999:999 /nsm/strelka/coord-redis-data"]
          volumeMounts:
            - {name: nsm, mountPath: /nsm}
      containers:
        - name: redis
          image: docker.io/library/redis:7-alpine
          args: ["redis-server", "--appendonly", "yes", "--dir", "/nsm/strelka/coord-redis-data"]
          ports:
            - {containerPort: 6379}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 512Mi}
          volumeMounts:
            - {name: nsm, mountPath: /nsm}
      volumes:
        - {name: nsm, persistentVolumeClaim: {claimName: nss-ndr-nsm}}
---
apiVersion: v1
kind: Service
metadata:
  name: nss-strelka-coordinator
  namespace: {{ .Release.Namespace }}
spec:
  selector: {app: nss-strelka-coordinator}
  ports:
    - {port: 6380, targetPort: 6379}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nss-strelka-gatekeeper
  namespace: {{ .Release.Namespace }}
  labels: {app: nss-strelka-gatekeeper}
spec:
  replicas: 1
  selector:
    matchLabels: {app: nss-strelka-gatekeeper}
  template:
    metadata:
      labels: {app: nss-strelka-gatekeeper}
    spec:
      imagePullSecrets: {{ toYaml .Values.images.pullSecrets | nindent 8 }}
      initContainers:
        - name: prepare-data
          image: docker.io/library/busybox:1.36
          command: ["sh", "-c", "mkdir -p /nsm/strelka/gk-redis-data && chown -R 999:999 /nsm/strelka/gk-redis-data"]
          volumeMounts:
            - {name: nsm, mountPath: /nsm}
      containers:
        - name: redis
          image: docker.io/library/redis:7-alpine
          args: ["redis-server", "--appendonly", "yes", "--dir", "/nsm/strelka/gk-redis-data"]
          ports:
            - {containerPort: 6379}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 512Mi}
          volumeMounts:
            - {name: nsm, mountPath: /nsm}
      volumes:
        - {name: nsm, persistentVolumeClaim: {claimName: nss-ndr-nsm}}
---
apiVersion: v1
kind: Service
metadata:
  name: nss-strelka-gatekeeper
  namespace: {{ .Release.Namespace }}
spec:
  selector: {app: nss-strelka-gatekeeper}
  ports:
    - {port: 6381, targetPort: 6379}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nss-strelka-frontend
  namespace: {{ .Release.Namespace }}
  labels: {app: nss-strelka-frontend}
spec:
  replicas: 1
  selector:
    matchLabels: {app: nss-strelka-frontend}
  template:
    metadata:
      labels: {app: nss-strelka-frontend}
    spec:
      imagePullSecrets: {{ toYaml .Values.images.pullSecrets | nindent 8 }}
      initContainers:
        - name: prepare-dirs
          image: docker.io/library/busybox:1.36
          command: ["sh", "-c", "mkdir -p /nsm/strelka/log && chown -R 939:939 /nsm/strelka/log"]
          volumeMounts:
            - {name: nsm, mountPath: /nsm}
      containers:
        - name: frontend
          image: "{{ .Values.images.registry }}/nss-ndr-strelka-manager:{{ .Values.images.tag }}"
          command: ["strelka-frontend"]
          ports:
            - {containerPort: 57314}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 512Mi}
          volumeMounts:
            - {name: config, mountPath: /etc/strelka, readOnly: true}
            - {name: nsm, mountPath: /nsm}
      volumes:
        - name: config
          configMap:
            name: nss-ndr-config
            items:
              - {key: strelka_frontend.yaml, path: frontend.yaml}
        - {name: nsm, persistentVolumeClaim: {claimName: nss-ndr-nsm}}
---
apiVersion: v1
kind: Service
metadata:
  name: nss-strelka-frontend
  namespace: {{ .Release.Namespace }}
spec:
  selector: {app: nss-strelka-frontend}
  ports:
    - {port: 57314, targetPort: 57314}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nss-strelka-backend
  namespace: {{ .Release.Namespace }}
  labels: {app: nss-strelka-backend}
spec:
  replicas: {{ $backendReplicas }}
  selector:
    matchLabels: {app: nss-strelka-backend}
  template:
    metadata:
      labels: {app: nss-strelka-backend}
    spec:
      imagePullSecrets: {{ toYaml .Values.images.pullSecrets | nindent 8 }}
      containers:
        - name: backend
          image: "{{ .Values.images.registry }}/nss-ndr-strelka-backend:{{ .Values.images.tag }}"
          command: ["strelka-backend"]
          resources:
            requests: {cpu: 200m, memory: 256Mi}
            limits: {cpu: "2", memory: 4Gi}
          volumeMounts:
            - {name: config, mountPath: /etc/strelka, readOnly: true}
            - {name: yara, mountPath: /etc/yara}
      volumes:
        - name: config
          configMap:
            name: nss-ndr-config
            items:
              - {key: strelka_backend.yaml, path: backend.yaml}
              - {key: strelka_logging.yaml, path: logging.yaml}
              - {key: strelka_passwords_dat, path: passwords.dat}
              - {key: strelka_taste_yara, path: taste/taste.yara}
        - name: yara
          hostPath:
            path: /opt/so/conf/strelka/rules/compiled
            type: DirectoryOrCreate
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nss-strelka-filestream
  namespace: {{ .Release.Namespace }}
  labels: {app: nss-strelka-filestream}
spec:
  replicas: 1
  selector:
    matchLabels: {app: nss-strelka-filestream}
  template:
    metadata:
      labels: {app: nss-strelka-filestream}
    spec:
      imagePullSecrets: {{ toYaml .Values.images.pullSecrets | nindent 8 }}
      initContainers:
        - name: prepare-dirs
          image: docker.io/library/busybox:1.36
          command: ["sh", "-c", "mkdir -p /nsm/strelka/unprocessed /nsm/strelka/staging /nsm/strelka/processed && chown -R 939:939 /nsm/strelka/unprocessed /nsm/strelka/staging /nsm/strelka/processed"]
          volumeMounts:
            - {name: nsm, mountPath: /nsm}
      containers:
        - name: filestream
          image: "{{ .Values.images.registry }}/nss-ndr-strelka-manager:{{ .Values.images.tag }}"
          command: ["strelka-filestream"]
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 512Mi}
          volumeMounts:
            - {name: config, mountPath: /etc/strelka, readOnly: true}
            - {name: nsm, mountPath: /nsm}
      volumes:
        - name: config
          configMap:
            name: nss-ndr-config
            items:
              - {key: strelka_filestream.yaml, path: filestream.yaml}
        - {name: nsm, persistentVolumeClaim: {claimName: nss-ndr-nsm}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nss-strelka-manager
  namespace: {{ .Release.Namespace }}
  labels: {app: nss-strelka-manager}
spec:
  replicas: 1
  selector:
    matchLabels: {app: nss-strelka-manager}
  template:
    metadata:
      labels: {app: nss-strelka-manager}
    spec:
      imagePullSecrets: {{ toYaml .Values.images.pullSecrets | nindent 8 }}
      containers:
        - name: manager
          image: "{{ .Values.images.registry }}/nss-ndr-strelka-manager:{{ .Values.images.tag }}"
          command: ["strelka-manager"]
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 200m, memory: 256Mi}
          volumeMounts:
            - {name: config, mountPath: /etc/strelka, readOnly: true}
      volumes:
        - name: config
          configMap:
            name: nss-ndr-config
            items:
              - {key: strelka_manager.yaml, path: manager.yaml}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nss-strelka-filecheck
  namespace: {{ .Release.Namespace }}
  labels: {app: nss-strelka-filecheck}
spec:
  replicas: 1
  selector:
    matchLabels: {app: nss-strelka-filecheck}
  template:
    metadata:
      labels: {app: nss-strelka-filecheck}
    spec:
      imagePullSecrets: {{ toYaml .Values.images.pullSecrets | nindent 8 }}
      containers:
        - name: filecheck
          image: "{{ .Values.images.registry }}/nss-ndr-filecheck:{{ .Values.images.tag }}"
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: 200m, memory: 512Mi}
          volumeMounts:
            - {name: nsm, mountPath: /nsm}
      volumes:
        - {name: nsm, persistentVolumeClaim: {claimName: nss-ndr-nsm}}
{{- end }}
