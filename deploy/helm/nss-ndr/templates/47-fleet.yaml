---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: nss-fleet-init
  namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: nss-fleet-init
  namespace: {{ .Release.Namespace }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: nss-fleet-init
  namespace: {{ .Release.Namespace }}
subjects:
  - {kind: ServiceAccount, name: nss-fleet-init, namespace: {{ .Release.Namespace }}}
roleRef:
  {kind: Role, name: nss-fleet-init, apiGroup: rbac.authorization.k8s.io}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nss-fleet-server
  namespace: {{ .Release.Namespace }}
  labels: {app: nss-fleet-server}
spec:
  replicas: 1
  selector:
    matchLabels: {app: nss-fleet-server}
  template:
    metadata:
      labels: {app: nss-fleet-server}
    spec:
      imagePullSecrets: {{ toYaml .Values.images.pullSecrets | nindent 8 }}
      containers:
        - name: fleet-server
          image: "{{ .Values.images.registry }}/nss-ndr-elastic-agent:{{ .Values.images.tag }}"
          imagePullPolicy: IfNotPresent
          env:
            - {name: FLEET_SERVER_ENABLE, value: "true"}
            - {name: FLEET_SERVER_ELASTICSEARCH_HOST, value: "http://nss-elasticsearch:9200"}
            - name: FLEET_SERVER_SERVICE_TOKEN
              valueFrom: {secretKeyRef: {name: nss-fleet-enrollment, key: es_service_token}}
            - {name: FLEET_SERVER_POLICY_ID, value: "FleetServer-nss"}
            - {name: FLEET_SERVER_CERT, value: "/etc/elastic-agent/certs/fleet-server.crt"}
            - {name: FLEET_SERVER_CERT_KEY, value: "/etc/elastic-agent/certs/fleet-server.key"}
            - {name: FLEET_SERVER_HOST, value: "0.0.0.0"}
            - {name: FLEET_SERVER_PORT, value: "8220"}
          ports:
            - {containerPort: 8220}
          resources:
            requests: {memory: 256Mi}
            limits: {memory: 1Gi}
          volumeMounts:
            - {name: certs, mountPath: /etc/elastic-agent/certs, readOnly: true}
            - {name: data, mountPath: /usr/share/elastic-agent/data}
      volumes:
        - {name: certs, secret: {secretName: nss-ndr-certs}}
        - {name: data, emptyDir: {}}
---
apiVersion: v1
kind: Service
metadata:
  name: nss-fleet-server
  namespace: {{ .Release.Namespace }}
spec:
  selector: {app: nss-fleet-server}
  ports:
    - {port: 8220, targetPort: 8220}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: nss-fleet-init
  namespace: {{ .Release.Namespace }}
  labels: {app: nss-fleet-init}
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      serviceAccountName: nss-fleet-init
      restartPolicy: OnFailure
      imagePullSecrets: {{ toYaml .Values.images.pullSecrets | nindent 8 }}
      containers:
        - name: fleet-init
          image: "{{ .Values.images.registry }}/nss-ndr-fleet-init:{{ .Values.images.tag }}"
          imagePullPolicy: IfNotPresent
          env:
            - {name: KIBANA_URL, value: "http://nss-kibana:5601"}
            - {name: ES_USER, value: "elastic"}
            - name: ES_PASSWORD
              valueFrom: {secretKeyRef: {name: nss-ndr-secrets, key: elastic-password}}
            - {name: NAMESPACE, value: {{ .Release.Namespace | quote }}}
            - {name: SECRET_NAME, value: "nss-fleet-enrollment"}
          resources:
            requests: {memory: 128Mi}
            limits: {memory: 256Mi}
          volumeMounts:
            - {name: certs, mountPath: /etc/elastic-agent/certs, readOnly: true}
      volumes:
        - {name: certs, secret: {secretName: nss-ndr-certs}}
