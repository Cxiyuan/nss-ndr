apiVersion: apps/v1
kind: Deployment
metadata:
  name: nss-detections
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  selector:
    matchLabels: {app: nss-detections}
  template:
    metadata:
      labels: {app: nss-detections}
    spec:
      imagePullSecrets: {{ toYaml .Values.images.pullSecrets | nindent 8 }}
      containers:
        - name: detections
          image: "{{ .Values.images.registry }}/nss-ndr-detections:{{ .Values.images.tag }}"
          imagePullPolicy: IfNotPresent
          env:
            - {name: LISTEN_ADDR, value: ":8080"}
          ports:
            - {containerPort: 8080}
          volumeMounts:
            - {name: config, mountPath: /opt/so/conf, readOnly: true}
            - {name: rules, mountPath: /opt/so/rules/suricata}
            - {name: run, mountPath: /var/run/suricata}
            - {name: state, mountPath: /opt/so/state}
      volumes:
        - {name: config, configMap: {name: nss-ndr-config}}
        - {name: rules, hostPath: {path: /opt/so/rules/suricata, type: DirectoryOrCreate}}
        - {name: run, hostPath: {path: /opt/so/run/suricata, type: DirectoryOrCreate}}
        - {name: state, hostPath: {path: /opt/so/state, type: DirectoryOrCreate}}
---
apiVersion: v1
kind: Service
metadata:
  name: nss-detections
  namespace: {{ .Release.Namespace }}
spec:
  type: NodePort
  selector: {app: nss-detections}
  ports:
    - {port: 8080, targetPort: 8080, nodePort: {{ .Values.service.detectionsNodePort }}}
