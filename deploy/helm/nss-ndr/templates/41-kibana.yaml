apiVersion: apps/v1
kind: Deployment
metadata:
  name: nss-kibana
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  selector:
    matchLabels: {app: nss-kibana}
  template:
    metadata:
      labels: {app: nss-kibana}
    spec:
      imagePullSecrets: {{ toYaml .Values.images.pullSecrets | nindent 8 }}
      containers:
        - name: kibana
          image: "{{ .Values.images.registry }}/nss-ndr-kibana:{{ .Values.images.tag }}"
          imagePullPolicy: IfNotPresent
          env:
            - {name: ES_USERNAME, value: "kibana_system"}
            - name: ES_PASSWORD
              valueFrom: {secretKeyRef: {name: nss-ndr-secrets, key: kibana-password}}
          ports:
            - {containerPort: 5601}
---
apiVersion: v1
kind: Service
metadata:
  name: nss-kibana
  namespace: {{ .Release.Namespace }}
spec:
  type: NodePort
  selector: {app: nss-kibana}
  ports:
    - {port: 5601, targetPort: 5601, nodePort: {{ .Values.service.kibanaNodePort }}}
