apiVersion: apps/v1
kind: Deployment
metadata:
  name: nss-kibana
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels: {app: nss-kibana}
  template:
    metadata:
      labels: {app: nss-kibana}
    spec:
      imagePullSecrets: {{ toYaml .Values.images.pullSecrets | nindent 8 }}
      containers:
        - name: kibana
          image: "{{ .Values.images.registry }}/nss-ndr-kibana:{{ .Values.images.tag }}"
          imagePullPolicy: IfNotPresent
          env:
            - {name: ELASTICSEARCH_HOSTS, value: "http://nss-elasticsearch:9200"}
            - {name: ELASTICSEARCH_USERNAME, value: "kibana_system"}
            - {name: ELASTICSEARCH_PASSWORD, valueFrom: {secretKeyRef: {name: nss-ndr-secrets, key: kibana-password}}}
          ports:
            - {containerPort: 5601}
        - name: kibana-init
          image: "{{ .Values.images.registry }}/nss-ndr-kibana-init:{{ .Values.images.tag }}"
          imagePullPolicy: IfNotPresent
          env:
            - {name: KIBANA_URL, value: "http://localhost:5601"}
            - {name: KIBANA_USERNAME, value: "elastic"}
            - name: KIBANA_PASSWORD
              valueFrom: {secretKeyRef: {name: nss-ndr-secrets, key: elastic-password}}
          resources:
            requests: {memory: 32Mi}
            limits: {memory: 128Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: nss-kibana
  namespace: {{ .Release.Namespace }}
spec:
  type: NodePort
  selector: {app: nss-kibana}
  ports:
    - {port: 5601, targetPort: 5601, nodePort: {{ .Values.service.kibanaNodePort }}}
