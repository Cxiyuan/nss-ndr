# NSS-NDR Helm values

images:
  registry: ghcr.io/cxiyuan/nss-ndr   # 仓库级命名空间（包自动继承仓库 public 可见性）
  tag: 048ad1bcb186aca89ac5454bc6760be45c958f08
  pullSecrets: []   # 镜像包已公开；如后续改私有，填 [{name: ghcr-pull}]
  elasticsearch: docker.elastic.co/elasticsearch/elasticsearch:9.3.3

# 与 configs/probe.yaml 同结构的探针配置
probeConfig:
  probe:
    id: nss-001
    # 镜像口（抓包网卡）：部署时必填，如 --set probeConfig.probe.interface=enp5s0
    interface: ""
    home_net:
      - 10.0.0.0/8
      - 192.168.0.0/16
      - 172.16.0.0/12
    external_net: any
    bpf: ""
    min_free_gb: 20
    disk_pressure_threshold: 90
    cleanup_interval: "1h"
  suricata:
    enabled: true
    af_packet_threads: 4
    pcap:
      enabled: true
      file_size_mb: 1000
      compression: none
      retention_days: 7
      storage_limit_gb: 500
    eve:
      retention_days: 7
  zeek:
    enabled: true
    workers: 4
    buffer_size: 128*1024*1024
    log_rotation_interval_s: 3600
    history_retention_days: 30
    extraction:
      max_days: 7
  strelka:
    enabled: true
    backend_replicas: 1
    retention:
      processed_days: 30
      history_days: 2
      log_days: 30
  elasticsearch:
    heap_gb: 2
    retention:
      metadata_days: 60
      alerts_days: 365
  detections:
    default_ruleset: none
  xdr:
    webhook:
      url: https://xdr.example.com/api/v1/alerts/webhook
      secret: ""
    timeout_s: 10
    push_interval_s: 2
    retry_max: 5
    event_types:
      - suricata.alert
      - zeek.notice

# 凭据（部署前修改）
secrets:
  elastic: nss-ndr@2026
  filebeat: CHANGE_ME_filebeat
  kibana: CHANGE_ME_kibana
  kibanaEncryption: CHANGE_ME_kibana_encryption
  kibanaEncryptedSavedObjects: CHANGE_ME_kibana_eso
  kibanaReporting: CHANGE_ME_kibana_reporting
  xdrPush: CHANGE_ME_xdr

service:
  kibanaNodePort: 30601
  detectionsNodePort: 30602

cleaner:
  schedule: "0 * * * *"

# 资源配额（可选覆盖；默认见各模板）
resources:
  suricata:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {cpu: "4", memory: 4Gi}
  zeek:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {cpu: "4", memory: 4Gi}
  logstash:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {cpu: "1", memory: 2Gi}
