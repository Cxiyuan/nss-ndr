# NSS-NDR Kibana 配置

server.host: "0.0.0.0"
server.port: 5601
# 嵌入探针管理 UI：Kibana 挂载在 /kibana 前缀下，由 ndr-manager 反向代理
server.basePath: "/kibana"
server.rewriteBasePath: true
# 探针管理后台代理需要调用 internal API（登录会话），自托管环境放行内部路由
server.restrictInternalApis: false

elasticsearch.hosts: ["http://nss-elasticsearch:9200"]
elasticsearch.ssl.verificationMode: none
# 认证由容器 env（ELASTICSEARCH_USERNAME/ELASTICSEARCH_PASSWORD）注入

logging.root.level: info
