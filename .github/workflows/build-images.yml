name: build-images

on:
  push:
    branches: [master]
    tags: ["v*"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  # 镜像名：ghcr.io/<owner>/nss-ndr-suricata / nss-ndr-zeek

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: suricata
            context: images/suricata
            file: images/suricata/Dockerfile
          - name: zeek
            context: images/zeek
            file: images/zeek/Dockerfile
          - name: es-init
            context: images/es-init
            file: images/es-init/Dockerfile
          - name: filebeat
            context: images/filebeat
            file: images/filebeat/Dockerfile
          - name: kibana
            context: images/kibana
            file: images/kibana/Dockerfile
          - name: detections
            context: images/detections
            file: images/detections/Dockerfile
          - name: xdr-push
            context: images/xdr-push
            file: images/xdr-push/Dockerfile
          - name: cleaner
            context: images/cleaner
            file: images/cleaner/Dockerfile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lowercase owner
        run: echo "OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: meta
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.OWNER_LC }}/nss-ndr-${{ matrix.name }}
        run: |
          TAGS="$IMAGE:latest,$IMAGE:${{ github.sha }}"
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            TAGS="$TAGS,$IMAGE:${{ github.ref_name }}"
          fi
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

      - name: Make package public
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --method PATCH "/user/packages/container/nss-ndr-${{ matrix.name }}" \
            -f visibility=public && \
          echo "包已公开: nss-ndr-${{ matrix.name }}"
