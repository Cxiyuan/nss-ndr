name: build-images

on:
  push:
    branches: [master]
    tags: ["v*"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  # 镜像推送到仓库级命名空间 ghcr.io/<owner>/<repo>/nss-ndr-<name>
  # 仓库已 public，仓库关联的包自动继承 public 可见性（无需单独设包可见性）

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: suricata
            context: images/suricata
            file: images/suricata/Dockerfile
          - name: zeek
            context: images/zeek
            file: images/zeek/Dockerfile
          - name: es-init
            context: images/es-init
            file: images/es-init/Dockerfile
          - name: filebeat
            context: images/filebeat
            file: images/filebeat/Dockerfile
          - name: logstash
            context: .
            file: images/logstash/Dockerfile
          - name: kibana
            context: images/kibana
            file: images/kibana/Dockerfile
          - name: kibana-init
            context: images/kibana-init
            file: images/kibana-init/Dockerfile
          - name: ndr-manager
            context: .
            file: images/ndr-manager/Dockerfile
          - name: xdr-push
            context: images/xdr-push
            file: images/xdr-push/Dockerfile
          - name: cleaner
            context: images/cleaner
            file: images/cleaner/Dockerfile
          - name: strelka-backend
            context: images/strelka-backend
            file: images/strelka-backend/Dockerfile
          - name: strelka-manager
            context: images/strelka-manager
            file: images/strelka-manager/Dockerfile
          - name: strelka-rules
            context: images/strelka-rules
            file: images/strelka-rules/Dockerfile
          - name: filecheck
            context: images/filecheck
            file: images/filecheck/Dockerfile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lowercase owner
        run: echo "OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: meta
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.OWNER_LC }}/${{ github.event.repository.name }}/nss-ndr-${{ matrix.name }}
        run: |
          TAGS="$IMAGE:latest,$IMAGE:${{ github.sha }}"
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            TAGS="$TAGS,$IMAGE:${{ github.ref_name }}"
          fi
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

      # 发布门禁：kibana-init 镜像必须内置 NDR 看板（195 个 saved objects），
      # 缺文件/行数不对直接让构建失败，确保看板随版本发行
      - name: Verify NDR dashboards bundled in image
        if: matrix.name == 'kibana-init'
        run: |
          IMG="${REGISTRY}/${OWNER_LC}/${GITHUB_REPOSITORY#*/}/nss-ndr-kibana-init:${GITHUB_SHA}"
          docker run --rm --entrypoint /bin/sh "$IMG" -c \
            'test -s /opt/kibana-init/dashboards.ndjson && \
             [ "$(grep -c "\"type\":" /opt/kibana-init/dashboards.ndjson)" = "195" ] && \
             tail -1 /opt/kibana-init/dashboards.ndjson | grep -q exportedCount && \
             echo "dashboards OK: 195 saved objects bundled in image"'
