input {
  elastic_agent {
    port => 5055
    tags => [ "nss-ndr", "elastic-agent" ]
    ssl_enabled => true
    ssl_certificate => "/usr/share/logstash/certs/logstash.crt"
    ssl_key => "/usr/share/logstash/certs/logstash.key"
    ssl_certificate_authorities => ["/usr/share/logstash/certs/ca.crt"]
    ecs_compatibility => v8
  }
}

filter {
  # filebeat 已直接生成 metadata.pipeline/_id；兼容旧数据（@metadata 传输时补齐）
  if [@metadata][pipeline] and ![metadata][pipeline] {
    mutate {
      copy => { "[@metadata][pipeline]" => "[metadata][pipeline]" }
    }
  }
  if ![metadata] {
    mutate {
      rename => { "@metadata" => "metadata" }
    }
  }
}
