output {
  if [metadata][pipeline] {
    elasticsearch {
      hosts => ["${ES_HOST:-http://nss-elasticsearch:9200}"]
      user => "${ES_USERNAME:-}"
      password => "${ES_PASSWORD:-}"
      data_stream => true
      ecs_compatibility => v8
      pipeline => "%{[metadata][pipeline]}"
      ssl_verification_mode => none
      ssl_enabled => false
    }
  } else {
    elasticsearch {
      hosts => ["${ES_HOST:-http://nss-elasticsearch:9200}"]
      user => "${ES_USERNAME:-}"
      password => "${ES_PASSWORD:-}"
      data_stream => true
      ecs_compatibility => v8
      ssl_verification_mode => none
      ssl_enabled => false
    }
  }
}
