output {
  if [metadata][pipeline] {
    elasticsearch {
      hosts => ["${ES_HOST:-http://nss-elasticsearch:9200}"]
      user => "${ES_USERNAME:-}"
      password => "${ES_PASSWORD:-}"
      data_stream => true
      ecs_compatibility => v8
      pipeline => "%{[metadata][pipeline]}"
      action => "create"
      document_id => "%{[metadata][_id]}"
      silence_errors_in_log => ["version_conflict_engine_exception"]
      ssl_verification_mode => none
      ssl_enabled => false
    }
  } else {
    elasticsearch {
      hosts => ["${ES_HOST:-http://nss-elasticsearch:9200}"]
      user => "${ES_USERNAME:-}"
      password => "${ES_PASSWORD:-}"
      data_stream => true
      ecs_compatibility => v8
      action => "create"
      document_id => "%{[metadata][_id]}"
      silence_errors_in_log => ["version_conflict_engine_exception"]
      ssl_verification_mode => none
      ssl_enabled => false
    }
  }
}
