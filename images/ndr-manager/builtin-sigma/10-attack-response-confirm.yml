title: 攻击成功响应确认（ET ATTACK_RESPONSE 线索 + Zeek HTTP 回显）
id: 11111111-000a-4000-8000-00000000000a
status: stable
level: high
backend: auto
logsource:
  product: suricata
  category: network
description: 攻击响应特征线索命中后，联动同 community_id 的 Zeek HTTP 记录确认脚本类端点返回 200（命令回显/Webshell），作为攻击落地的强证据。
correlation:
  clue:
    logsource:
      product: suricata
    detection:
      selection:
        rule.name|contains: "ET ATTACK_RESPONSE"
      condition: selection
  confirm:
    logsource:
      product: zeek
      category: http
    detection:
      selection_status:
        http.response.status_code: 200
      selection_script:
        url.full|endswith:
          - .php
          - .jsp
          - .aspx
          - .asp
          - .cgi
      condition: selection_status and selection_script
  group_by: network.community_id
  timespan: 5m
  required: both
  fallback: none
  confidence: high
