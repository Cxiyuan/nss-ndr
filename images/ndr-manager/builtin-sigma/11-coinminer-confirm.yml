    logsource:
      product: suricata
    detection:
      selection:
        rule.name|contains: "ET COINMINER"
      condition: selection
  confirm:
    logsource:
      product: zeek
      category: network_connection
    detection:
      selection:
        event.duration|gte: 600
      condition: selection
  group_by: network.community_id
  timespan: 10m
  required: both
  fallback: clue_only
  confidence: medium
