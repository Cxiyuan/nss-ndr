title: 挖矿连接确认（ET COINMINER 线索 + Zeek 长连接）
id: 11111111-000b-4000-8000-00000000000b
status: stable
level: medium
backend: auto
logsource:
  product: suricata
  category: network
description: 挖矿线索命中后，联动同 community_id 的 Zeek 连接时长（>=600 秒）确认挖矿池长连接，过滤偶发特征误报。
correlation:
