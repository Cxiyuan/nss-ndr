title: 内网端口扫描确认（Suricata 线索 + Zeek 连接状态）
id: 11111111-0001-4000-8000-000000000001
status: stable
level: medium
backend: auto
logsource:
  product: suricata
  category: network
description: ET SCAN 线索命中后，联动同 community_id 的 Zeek conn 连接状态 REJ（目标端口拒绝）确认扫描行为，降低监控探针/正常扫描器噪音。
correlation:
  clue:
    logsource:
      product: suricata
    detection:
      selection:
        rule.name|contains: "ET SCAN"
      condition: selection
  confirm:
    logsource:
      product: zeek
      category: network_connection
    detection:
      selection:
        connection.state: REJ
      condition: selection
  group_by: network.community_id
  timespan: 10m
  required: both
  fallback: clue_only
  confidence: medium
