title: 扫描器 Web 侦察确认（scanner/ET SCAN 线索 + Zeek UA）
id: 11111111-0008-4000-8000-000000000008
status: stable
level: medium
backend: auto
logsource:
  product: suricata
  category: network
description: 扫描器类线索命中后，联动同 community_id 的 Zeek HTTP 记录中的已知扫描器 User-Agent（sqlmap/nikto/nuclei 等）确认侦察行为。
correlation:
  clue:
    logsource:
      product: suricata
    detection:
      selection:
        rule.name|contains:
          - scanner
          - ET SCAN
      condition: selection
  confirm:
    logsource:
      product: zeek
      category: http
    detection:
      selection:
        user_agent.original|contains:
          - sqlmap
          - nikto
          - nuclei
          - nmap
          - masscan
          - gobuster
          - dirsearch
          - wpscan
          - xray
      condition: selection
  group_by: network.community_id
  timespan: 10m
  required: both
  fallback: clue_only
  confidence: medium
