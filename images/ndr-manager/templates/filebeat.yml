# NSS-NDR filebeat 配置模板（由 render-configs.py 渲染，${VAR} 为占位符）

filebeat.inputs:
  - type: filestream
    id: suricata-eve
    enabled: true
    paths:
      - /nsm/suricata/eve*.json
    prospector:
      scanner:
        exclude_files:
          - '\.gz$'
    parsers:
      - ndjson:
          target: ""
    processors:
      - add_fields:
          target: event
          fields:
            category: network
            module: suricata
      - script:
          lang: javascript
          source: >
            function process(event) {
              var et = event.Get("event_type") || "other";
              event.Put("metadata.pipeline", et === "alert" ? "suricata.alert" : "suricata.common");
              var src = (event.Get("log.file.fingerprint") || "") + "|" + (event.Get("log.offset") || "");
              var h = 5381;
              for (var i = 0; i < src.length; i++) {
                h = ((h << 5) + h + src.charCodeAt(i)) >>> 0;
              }
              event.Put("metadata._id", "nss-" + h.toString(16));
            }
      - add_fields:
          target: data_stream
          fields:
            type: logs
            dataset: suricata.alerts
            namespace: so

  - type: filestream
    id: zeek-logs
    enabled: true
    paths:
      - /nsm/zeek/logs/current/*.log
    prospector:
      scanner:
        exclude_files:
          - '(broker|capture_loss|cluster|conn-summary|console|ecat_arp_info|known_certs|known_hosts|known_services|loaded_scripts|ntp|ocsp|packet_filter|reporter|stats|stderr|stdout)(\..+)?\.log$'
    processors:
      - dissect:
          tokenizer: "/nsm/zeek/logs/current/%{pipeline}.log"
          field: log.file.path
          trim_chars: ".log"
          target_prefix: ""
      - script:
          lang: javascript
          source: >
            function process(event) {
              var pl = event.Get("pipeline");
              event.Put("metadata.pipeline", "zeek." + pl);
              var src = (event.Get("log.file.fingerprint") || "") + "|" + (event.Get("log.offset") || "");
              var h = 5381;
              for (var i = 0; i < src.length; i++) {
                h = ((h << 5) + h + src.charCodeAt(i)) >>> 0;
              }
              event.Put("metadata._id", "nss-" + h.toString(16));
            }
      - add_fields:
          target: event
          fields:
            category: network
            module: zeek
      - add_fields:
          target: data_stream
          fields:
            type: logs
            dataset: zeek
            namespace: so
      - add_tags:
          tags: ["ics"]
          when:
            regexp:
              pipeline: "^bacnet|^bsap|^cip|^cotp|^dnp3|^ecat|^enip|^modbus|^opcua|^profinet|^s7comm"

  # Strelka 扫描结果（参照 SO：filestream 集成 tail /nsm/strelka/log/strelka.log，
  # 不解析 ndjson，整行留 message 交给 ES strelka.file pipeline 归一化）
  - type: filestream
    id: strelka-logs
    enabled: true
    paths:
      - /nsm/strelka/log/strelka.log
    prospector:
      scanner:
        exclude_files:
          - '\.gz$'
    processors:
      - add_fields:
          target: event
          fields:
            category: file
            module: strelka
      - script:
          lang: javascript
          source: >
            function process(event) {
              event.Put("metadata.pipeline", "strelka.file");
              var src = (event.Get("log.file.fingerprint") || "") + "|" + (event.Get("log.offset") || "");
              var h = 5381;
              for (var i = 0; i < src.length; i++) {
                h = ((h << 5) + h + src.charCodeAt(i)) >>> 0;
              }
              event.Put("metadata._id", "nss-" + h.toString(16));
            }
      - add_fields:
          target: data_stream
          fields:
            type: logs
            dataset: strelka
            namespace: so

# 数据总线：Lumberjack 输出到 Logstash（对齐 SO 架构）
output.logstash:
  hosts: ["${LOGSTASH_HOST:nss-logstash:5055}"]
  ssl.certificate_authorities: ["${LOGSTASH_CA:/etc/filebeat/certs/ca.crt}"]
  ssl.certificate: "/etc/filebeat/certs/filebeat.crt"
  ssl.key: "/etc/filebeat/certs/filebeat.key"
  ssl.verification_mode: full
  worker: 2

setup.template.enabled: false
logging.level: info
