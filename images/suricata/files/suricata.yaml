# NSS-NDR Suricata 配置模板
# 由 releases/render-configs.py 从 probe.yaml 渲染（${VAR} 为占位符）

%YAML 1.1
---

default-log-dir: /var/log/suricata/

runmode: workers
max-pending-packets: 5000
default-packet-size: 9014

host-mode: auto

af-packet:
  - interface: ${INTERFACE}
    cluster-id: 59
    cluster-type: cluster_flow
    defrag: true
    use-mmap: true
    mmap-locked: false
    threads: ${THREADS}
    tpacket-v3: true
    ring-size: 5000
    block-size: 69632
    block-timeout: 10
    use-emergency-flush: true
    buffer-size: 32768
    disable-promisc: false
    checksum-checks: kernel

vars:
  address-groups:
    HOME_NET: ${HOME_NET}
    EXTERNAL_NET: ${EXTERNAL_NET}
    HTTP_SERVERS: "$HOME_NET"
    SMTP_SERVERS: "$HOME_NET"
    SQL_SERVERS: "$HOME_NET"
    DNS_SERVERS: "$HOME_NET"
    TELNET_SERVERS: "$HOME_NET"
    AIM_SERVERS: "$EXTERNAL_NET"
    DC_SERVERS: "$HOME_NET"
    DNP3_SERVER: "$HOME_NET"
    DNP3_CLIENT: "$HOME_NET"
    MODBUS_CLIENT: "$HOME_NET"
    MODBUS_SERVER: "$HOME_NET"
    ENIP_CLIENT: "$HOME_NET"
    ENIP_SERVER: "$HOME_NET"
  port-groups:
    HTTP_PORTS: 80
    SHELLCODE_PORTS: "!80"
    ORACLE_PORTS: 1521
    SSH_PORTS: 22
    DNP3_PORTS: 20000
    MODBUS_PORTS: 502
    FILE_DATA_PORTS: "[$HTTP_PORTS,110,143]"
    FTP_PORTS: 21
    VXLAN_PORTS: 4789
    TEREDO_PORTS: 3544
    SIP_PORTS: "[5060,5061]"
    GENEVE_PORTS: 6081

outputs:
  - fast:
      enabled: no
      filename: fast.log
      append: yes
  - eve-log:
      enabled: yes
      filetype: regular
      filename: /nsm/suricata/eve-%Y-%m-%d-%H:%M.json
      rotate-interval: hour
      pcap-file: false
      community-id: true
      community-id-seed: 0
      types:
        - alert:
            payload: false
            payload-buffer-size: 4kb
            payload-printable: true
            packet: true
            metadata:
              app-layer: false
              flow: false
              rule:
                metadata: true
                raw: true
            tagged-packets: false
            xff:
              enabled: false
              mode: extra-data
              deployment: reverse
              header: X-Forwarded-For
        - stats:
            enabled: no
            filename: stats.log
            append: yes
            totals: yes
            threads: no
            null-values: yes
  - file-store:
      version: 2
      enabled: no
      dir: /nsm/extracted
  - pcap-log:
      enabled: ${PCAP_ENABLED}
      filetype: regular
      filename: "%n/so-pcap.%t"
      limit: ${PCAP_FILE_SIZE_MB}mb
      mode: multi
      use-stream-depth: false
      compression: ${PCAP_COMPRESSION}
      lz4-checksum: false
      lz4-level: 8
      dir: /nsm/suripcap
      max-files: ${PCAP_MAX_FILES}

app-layer:
  protocols:
    tls:
      enabled: yes
      detection-ports:
        dp: 443
      ja3-fingerprints: auto
      ja4-fingerprints: auto
      encryption-handling: track-only
    http:
      enabled: yes
      libhtp:
        default-config:
          personality: IDS
          request-body-limit: 100 KiB
          response-body-limit: 100 KiB
    dns:
      global-memcap: 16mb
      state-memcap: 512kb
      request-flood: 500
      tcp:
        enabled: yes
        detection-ports:
          dp: 53
      udp:
        enabled: yes
        detection-ports:
          dp: 53
    smb:
      enabled: yes
      detection-ports:
        dp: 139, 445
    smtp:
      enabled: yes
      raw-extraction: false
      mime:
        decode-mime: true
        decode-base64: true
        decode-quoted-printable: true
        header-value-depth: 2000
        extract-urls: true
        body-md5: false
    ssh:
      enabled: yes
    dcerpc:
      enabled: yes
    modbus:
      enabled: yes
      detection-ports:
        dp: 502
      stream-depth: 0
    dnp3:
      enabled: yes
      detection-ports:
        dp: 20000
    enip:
      enabled: yes
      detection-ports:
        dp: 44818
        sp: 44818
    ntp:
      enabled: yes
    dhcp:
      enabled: yes
    sip:
      enabled: yes
    http2:
      enabled: yes

logging:
  default-log-level: notice
  outputs:
    - console:
        enabled: yes
    - file:
        enabled: yes
        level: info
        filename: suricata.log
    - syslog:
        enabled: no
        facility: local5

run-as:
  user: suricata
  group: suricata

# detections 服务通过 unix socket 触发规则热加载（与 SO 3.1.0 一致）
unix-command:
  enabled: auto

coredump:
  max-dump: unlimited

legacy:
  uricontent: enabled

engine-analysis:
  rules-fast-pattern: true
  rules: true

pcre:
  match-limit: 3500
  match-limit-recursion: 1500

default-rule-path: /etc/suricata/rules
rule-files:
  - all-rulesets.rules
classification-file: /etc/suricata/classification.config
reference-config-file: /etc/suricata/reference.config
threshold-file: /etc/suricata/threshold.conf
