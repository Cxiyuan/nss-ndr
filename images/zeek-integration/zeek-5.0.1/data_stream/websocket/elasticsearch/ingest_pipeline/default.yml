---
description: Pipeline for normalizing Zeek websocket.log
processors:
  - rename:
      field: message
      target_field: event.original
      ignore_missing: true
      if: ctx.event?.original == null
  - json:
      field: event.original
      target_field: _temp_
  - drop:
      description: Drop if no timestamp (invalid json)
      if: 'ctx?._temp_?.ts == null'
  - rename:
      field: _temp_
      target_field: zeek.websocket
      ignore_failure: true
  - set:
      field: event.created
      copy_from: "@timestamp"
  - set:
      field: event.kind
      value: event
  - set:
      field: ecs.version
      value: '8.17.0'
  - append:
      field: event.category
      value: network
  - dot_expander:
      path: zeek.websocket
      field: id.orig_p
      ignore_failure: true
  - dot_expander:
      path: zeek.websocket
      field: id.orig_h
      ignore_failure: true
  - dot_expander:
      path: zeek.websocket
      field: id.resp_h
      ignore_failure: true
  - dot_expander:
      path: zeek.websocket
      field: id.resp_p
      ignore_failure: true
  - rename:
      field: zeek.websocket.id.orig_h
      target_field: source.address
      ignore_missing: true
  - rename:
      field: zeek.websocket.id.orig_p
      target_field: source.port
      ignore_missing: true
  - rename:
      field: zeek.websocket.id.resp_h
      target_field: destination.address
      ignore_missing: true
  - rename:
      field: zeek.websocket.id.resp_p
      target_field: destination.port
      ignore_missing: true
  - rename:
      field: zeek.websocket.proto
      target_field: network.transport
      ignore_missing: true
  - rename:
      field: zeek.websocket.uid
      target_field: zeek.session_id
      ignore_missing: true
  - set:
      field: event.id
      copy_from: zeek.session_id
      if: ctx.zeek.session_id != null
  - set:
      field: source.ip
      copy_from: source.address
      if: ctx.source?.address != null
  - set:
      field: destination.ip
      copy_from: destination.address
      if: ctx.destination?.address != null
  - date:
      field: zeek.websocket.ts
      formats:
        - UNIX
        - ISO8601
  - remove:
      field: zeek.websocket.ts
      ignore_missing: true
  - append:
      field: related.ip
      value: '{{source.ip}}'
      if: ctx.source?.ip != null
      allow_duplicates: false
  - append:
      field: related.ip
      value: '{{destination.ip}}'
      if: ctx.destination?.ip != null
      allow_duplicates: false
  - remove:
      field:
        - zeek.websocket.id
        - message
        - json
        - _temp_
      ignore_missing: true
on_failure:
  - set:
      field: event.kind
      value: pipeline_error
  - append:
      field: error.message
      value: '{{_ingest.on_failure_processor_type}} failed: {{_ingest.on_failure_message}}'
  - append:
      field: tags
      value: preserve_original_event
      allow_duplicates: false
